name: security-and-reliability

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-recovery-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:security
      - run: npm run check
      - run: npm run test:study
      - run: npm run test:generation-recovery
      - run: npm run test:creator-publications
      - run: npm run test:interview
