name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:security
      - run: npm run test:monthly-catalog
      - run: npm run test:student-studio
      - run: npm test
      - run: npx tsx scripts/test-study.ts
      - run: npx tsx scripts/test-referrals.ts
      - run: npx tsx scripts/test-rewards.ts
      - run: npx tsx scripts/test-provider-config.ts
      - run: npx tsx scripts/test-consent-support.ts
      - run: npx tsx scripts/test-office.ts
      - run: npx tsx scripts/test-proxy.ts
      - run: npm run build
        env:
          NEXT_DIST_DIR: .next-validation
      - run: npm run test:student-studio-browser
