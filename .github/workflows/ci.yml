name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:admin-security
      - run: npm run test:admin-mfa-lifecycle
      - run: npm run test:workspace-routing
      - run: npm run test:security
      - run: npm run test:security-remediation
      - run: npx tsx scripts/test-request-budget.ts
      - run: npx tsx scripts/test-redesign.ts
      - run: npx tsx scripts/test-redesign.ts --mongo
      - run: npm run test:oauth-identity
      - run: npm run test:monthly-catalog
      - run: npm run test:growth
      - run: npm run test:payment-status
      - run: npm run test:seo
      - run: npm run test:publication-index
      - run: npm run test:student-studio
      - run: npm run test:chat-answer
      - run: npm run test:presentation-preview
      - run: npm run test:presentation-engine
      - run: npm run test:presentation-research
      - run: npm run test:learning-studio
      - run: npm run test:video-reviews
      - run: npm run test:radox
      - run: npm run test:writer-platform
      - run: npm run test:writer-editor-reliability
      - run: npm run test:writer-service-errors
      - run: npm run test:writer-discovery
      - run: npm run test:writer-publishing
      - run: npm run test:writer-moderation
      - run: npm run test:writer-recommendations
      - run: npm run test:writer-social
      - run: npm run test:writer-connections-activity
      - run: npm run test:writer-pins
      - run: npm test
      - run: npx tsx scripts/test-study.ts
      - run: npx tsx scripts/test-referrals.ts
      - run: npx tsx scripts/test-rewards.ts
      - run: npx tsx scripts/test-provider-config.ts
      - run: npx tsx scripts/test-consent-support.ts
      - run: npx tsx scripts/test-office.ts
      - run: npx tsx scripts/test-proxy.ts
      - run: npm run build
        env:
          NEXT_DIST_DIR: .next-validation
          NEXT_PUBLIC_APP_URL: https://www.syaahii.in
      - run: npm run test:security-browser
      - run: npm run test:student-studio-browser
      - run: npm run test:learning-studio-browser
      - run: npm run test:video-reviews-browser
      - run: npm run test:growth-browser
      - run: npm run test:presentation-workspace-browser
      - run: npm run test:payment-pages
      - run: npm run test:admin-routing-browser
      - run: npm run test:writer-discovery-browser
      - run: npm run test:writer-publishing-browser
      - run: npm run test:writer-recommendations-browser
      - run: npm run test:writer-editor-proxy-browser
      - run: npm run test:writer-social-workspace-browser
      - run: npm run test:writer-shell-hydration
      - run: npm run test:public-discovery-browser
